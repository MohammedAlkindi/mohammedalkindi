<svg xmlns="http://www.w3.org/2000/svg" width="114" height="78" viewBox="0 0 114 78">
  <defs>
    <style>
      .card-bg { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 8px; }
      .card-icon { color: #f0f6fc; }
      .card-text { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 500; text-anchor: middle; }
      @media (prefers-color-scheme: light) {
        .card-bg { fill: #f6f8fa; stroke: #d0d7de; }
        .card-icon { color: #1f2328; }
        .card-text { fill: #1f2328; }
      }
    </style>
  </defs>
  <rect class="card-bg" x="3" y="1" width="108" height="76" />
  <g class="card-icon" transform="translate(45, 10) scale(1)">
    <svg width="24" height="24" viewBox="0 0 24 24">
      <rect x="1" y="1" width="10" height="10" fill="currentColor"/><rect x="13" y="1" width="10" height="10" fill="currentColor"/><rect x="1" y="13" width="10" height="10" fill="currentColor"/><rect x="13" y="13" width="10" height="10" fill="currentColor"/>
    </svg>
  </g>
  <text class="card-text" x="57" y="60">Microsoft</text>
</svg>